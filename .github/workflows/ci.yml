name: CI

on:
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-build:
    name: Lint and Build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
      NEXT_PUBLIC_WEB_SERVER_URL: ${{ secrets.NEXT_PUBLIC_WEB_SERVER_URL }}
      NEXT_PUBLIC_OPENAPI_SERVER_URL: ${{ secrets.NEXT_PUBLIC_OPENAPI_SERVER_URL }}
      NEXT_PUBLIC_OAUTH_RESOURCE_SERVER_URL: ${{ secrets.NEXT_PUBLIC_OAUTH_RESOURCE_SERVER_URL }}
      NEXT_PUBLIC_OAUTH_AUTH_SERVER_URL: ${{ secrets.NEXT_PUBLIC_OAUTH_AUTH_SERVER_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

      - name: Type Check
        run: pnpm check-types

      - name: Test
        # 러너는 4 vCPU인데 패키지마다 vitest가 워커를 여러 개 띄우므로,
        # 모든 패키지를 한꺼번에 돌리면 jsdom 워커끼리 CPU를 나눠 쓰다 테스트가 제한 시간을 넘긴다.
        run: pnpm test --concurrency=2

      - name: Build
        run: pnpm build

      - name: Success Discord Notification
        uses: sarisia/actions-status-discord@v1.15.5
        if: success()
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          avatar_url: ${{ secrets.SUCCESS_DISCORD_AVATAR_URL }}
          title: '✅ CI 성공'
          status: success
          content: 'PR을 확인해주세요.'
          username: datagsm-front bot
          color: 0x4CAF50

      - name: Failure Discord Notification
        uses: sarisia/actions-status-discord@v1.15.5
        if: failure()
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          avatar_url: ${{ secrets.FAILED_DISCORD_AVATAR_URL }}
          title: '❌ CI 실패'
          content: '에러를 확인해주세요.'
          status: failure
          username: datagsm-front bot
          color: 0xe74c3c
